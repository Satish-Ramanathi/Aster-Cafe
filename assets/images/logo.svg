<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <defs>
    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AA68" />
      <stop offset="50%" stop-color="#C58A4E" />
      <stop offset="100%" stop-color="#A56A35" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 10-Petaled Aster Mandala Symbol -->
  <g transform="translate(100, 38)" filter="url(#goldGlow)">
    <!-- Central ring -->
    <circle cx="0" cy="0" r="4.5" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- 10 Petals rotated around 360 deg (every 36 deg) -->
    <!-- Petal template: loop petal pointing up -->
    <g id="petals">
      <!-- 0 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />
      <!-- 36 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(36)" />
      <!-- 72 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(72)" />
      <!-- 108 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(108)" />
      <!-- 144 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(144)" />
      <!-- 180 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(180)" />
      <!-- 216 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(216)" />
      <!-- 252 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(252)" />
      <!-- 288 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(288)" />
      <!-- 324 deg -->
      <path d="M 0,-6 C -4,-12 -6,-18 -4,-23 C -2,-28 0,-30 0,-30 C 0,-30 2,-28 4,-23 C 6,-18 4,-12 0,-6 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" transform="rotate(324)" />
    </g>
  </g>

  <!-- Typography -->
  <text x="100" y="93" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#FFFFFF" 
        text-anchor="middle">ASTER</text>
        
  <text x="100" y="108" 
        font-family="'Poppins', 'Montserrat', sans-serif" 
        font-size="8" 
        font-weight="600" 
        letter-spacing="3.5" 
        fill="url(#goldGrad)" 
        text-anchor="middle">CAFE &amp; KITCHEN</text>
</svg>
