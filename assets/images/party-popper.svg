<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Party Popper Cone -->
  <g transform="translate(4, 4)">
    <!-- Popper body -->
    <path d="M 12 44 L 20 52 L 44 28 L 36 20 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Yellow stripes on cone -->
    <path d="M 15 47 L 23 39 L 29 45 L 21 53 Z" fill="#FBC02D"/>
    <path d="M 28 34 L 36 26 L 42 32 L 34 40 Z" fill="#FBC02D"/>
    
    <!-- Popper opening burst -->
    <ellipse cx="40" cy="24" rx="6" ry="3" transform="rotate(-45 40 24)" fill="#FF7043" />
    
    <!-- Confetti & Streamers bursting out -->
    <!-- Streamer 1 (Red spiral) -->
    <path d="M 38 20 Q 42 12 48 14 Q 54 16 52 8" fill="none" stroke="#E91E63" stroke-width="2" stroke-linecap="round"/>
    <!-- Streamer 2 (Blue curly) -->
    <path d="M 44 26 Q 52 24 53 32 Q 54 40 60 38" fill="none" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
    <!-- Streamer 3 (Gold loop) -->
    <path d="M 36 17 Q 34 8 40 4" fill="none" stroke="#FFA000" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Confetti Dots & Stars -->
    <circle cx="48" cy="8" r="1.8" fill="#9C27B0" />
    <circle cx="32" cy="10" r="1.5" fill="#00BCD4" />
    <circle cx="56" cy="22" r="2" fill="#4CAF50" />
    <circle cx="42" cy="34" r="1.5" fill="#E91E63" />
    <circle cx="50" cy="42" r="1.8" fill="#FF9800" />
    
    <!-- Star sparkle -->
    <path d="M 46 16 L 47 19 L 50 20 L 47 21 L 46 24 L 45 21 L 42 20 L 45 19 Z" fill="#FFD54F"/>
  </g>
</svg>
